name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260616"
  LLVM_MINGW_SHA256: b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: 1.96.1-x86_64-unknown-linux-gnu
            host: x86_64-unknown-linux-gnu
          - os: windows-latest
            toolchain: 1.96.1-x86_64-pc-windows-gnullvm
            host: x86_64-pc-windows-gnullvm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # This overrides the repository's intentionally Windows-only release pin on Linux.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust host and components
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
      - name: Install pinned LLVM-MinGW
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archiveName = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW archive checksum mismatch: expected $env:LLVM_MINGW_SHA256, got $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = Join-Path $extractRoot "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64\bin"
          foreach ($required in @('x86_64-w64-mingw32-clang.exe', 'ld.lld.exe', 'llvm-ar.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $required) -PathType Leaf)) {
              throw "LLVM-MinGW archive is missing $required"
            }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned build hosts
        shell: bash
        run: |
          rust_version="$(rustc -vV)"
          printf '%s\n' "$rust_version"
          grep -Fq "release: 1.96.1" <<< "$rust_version"
          grep -Fq "host: ${{ matrix.host }}" <<< "$rust_version"
      - name: Verify pinned Windows linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (Get-Command x86_64-w64-mingw32-clang.exe -ErrorAction Stop).Source
          if (-not $linker.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) {
            throw "gnullvm linker did not resolve from the verified LLVM-MinGW archive: $linker"
          }
          & $linker --version
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Strict lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
