name: release

# A v* tag builds both packages, runs each one from its extracted archive outside the
# checkout, and creates a draft release with them and SHA256SUMS. A manual run does the
# same and stops at workflow artifacts. Nothing is published without a person.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same pinned LLVM-MinGW as ci.yml.
  LLVM_MINGW_VERSION: "20260616"
  LLVM_MINGW_SHA256: b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35
  # Prebuilt release tools, checked against the SHA-256 digests GitHub reports for each
  # upstream release asset.
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_LINUX_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  CARGO_ABOUT_WINDOWS_SHA256: 1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_AUDIT_WINDOWS_SHA256: 0a7316540862c13d954f648917ceacca593747baed6eec180fafa590be2710ab
  CARGO_CYCLONEDX_VERSION: 0.5.9
  CARGO_CYCLONEDX_WINDOWS_SHA256: 8750e00775661dcb75bc482c1a298839fd94e8a0c033b49905ba0f246ffed202

jobs:
  linux:
    name: Linux package
    # 22.04, so the binary asks for an older glibc than a 24.04 build would.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.96.1-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust host
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Verify pinned build host
        run: |
          rust_version="$(rustc -vV)"
          printf '%s\n' "$rust_version"
          grep -Fq "release: 1.96.1" <<< "$rust_version"
          grep -Fq "host: x86_64-unknown-linux-gnu" <<< "$rust_version"
      - name: Name the package
        id: package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "name=ordinata-$version-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"
      # The same remapping packaging/build-release.ps1 applies on Windows, so the binary
      # names no path on the build machine.
      - name: Release build
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTFLAGS="--remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/ordinata"
          cargo build --release --locked
      - name: Install cargo-about
        run: |
          archive="$RUNNER_TEMP/cargo-about.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_ABOUT_LINUX_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Stage the package
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          stage="dist/$NAME"
          mkdir -p "$stage"
          install -m 0755 target/release/ordinata "$stage/ordinata"
          cp LICENSE README.md "$stage/"
          cargo about generate --config packaging/about.toml packaging/about.hbs \
            -o "$stage/THIRD-PARTY-NOTICES.html"
          ls -l "$stage"
      - name: Scan the package for build-machine paths
        env:
          NAME: ${{ steps.package.outputs.name }}
          ORDINATA_SCAN_REQUIRED: "1"
        run: ORDINATA_SCAN_DIR="$PWD/dist/$NAME" cargo test --locked -p ordinata-cli --test artifact -- --nocapture
      - name: Archive
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          cd dist
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01 00:00:00Z' \
            -cf - "$NAME" | gzip -9n > "$NAME.tar.gz"
          sha256sum "$NAME.tar.gz"
      - name: Run the packaged program from the extracted archive
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          room="$(mktemp -d "$RUNNER_TEMP/ordinata-check.XXXXXX")"
          tar -xzf "dist/$NAME.tar.gz" -C "$room"
          exe="$room/$NAME/ordinata"
          cd "$room"
          # A bare environment: no toolchain, no checkout, nothing on PATH but the system.
          run() { env -i PATH=/usr/bin:/bin HOME="$room" "$exe" "$@"; }
          run --version
          run --help > /dev/null
          run demo --out demo --observed-at 2026-01-01T00:00:00Z
          run verify demo
          # One changed byte, and the packaged verifier must refuse the bundle with exit 5.
          printf 'x' >> demo/fit.csv
          status=0
          run verify demo || status=$?
          test "$status" -eq 5
          echo "a changed bundle exited $status"
          echo "newest glibc symbol version required:"
          objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordinata-linux-x86_64
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust host and components
        run: rustup toolchain install 1.96.1-x86_64-pc-windows-gnullvm --profile minimal --component rustfmt --component clippy
      - name: Install pinned LLVM-MinGW
        shell: pwsh
        run: |
          $archiveName = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extractRoot = Join-Path $env:RUNNER_TEMP "llvm-mingw-$env:LLVM_MINGW_VERSION"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$archiveName"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM-MinGW archive checksum mismatch: expected $env:LLVM_MINGW_SHA256, got $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          $bin = Join-Path $extractRoot "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64\bin"
          foreach ($required in @('x86_64-w64-mingw32-clang.exe', 'ld.lld.exe', 'llvm-ar.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $required) -PathType Leaf)) {
              throw "LLVM-MinGW archive is missing $required"
            }
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned Windows linker
        shell: pwsh
        run: |
          $linker = (Get-Command x86_64-w64-mingw32-clang.exe -ErrorAction Stop).Source
          if (-not $linker.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase)) {
            throw "gnullvm linker did not resolve from the verified LLVM-MinGW archive: $linker"
          }
          & $linker --version
      # packaging/package.ps1 runs cargo audit, cargo about and cargo cyclonedx.
      - name: Install release tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'release-tools'
          $bin = Join-Path $tools 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          function Get-Verified([string]$url, [string]$sha256, [string]$file) {
            $path = Join-Path $tools $file
            Invoke-WebRequest -Uri $url -OutFile $path
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $sha256) { throw "$file checksum mismatch: expected $sha256, got $actual" }
            return $path
          }

          $about = Get-Verified "https://github.com/EmbarkStudios/cargo-about/releases/download/$env:CARGO_ABOUT_VERSION/cargo-about-$env:CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc.tar.gz" $env:CARGO_ABOUT_WINDOWS_SHA256 'cargo-about.tar.gz'
          & "$env:SystemRoot\System32\tar.exe" -xzf $about -C $tools
          if ($LASTEXITCODE -ne 0) { throw "could not extract cargo-about" }
          Copy-Item (Join-Path $tools "cargo-about-$env:CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc\cargo-about.exe") $bin

          $audit = Get-Verified "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$env:CARGO_AUDIT_VERSION/cargo-audit-x86_64-pc-windows-msvc-v$env:CARGO_AUDIT_VERSION.zip" $env:CARGO_AUDIT_WINDOWS_SHA256 'cargo-audit.zip'
          Expand-Archive -LiteralPath $audit -DestinationPath (Join-Path $tools 'audit')
          Copy-Item (Join-Path $tools "audit\cargo-audit-x86_64-pc-windows-msvc-v$env:CARGO_AUDIT_VERSION\cargo-audit.exe") $bin

          $cyclonedx = Get-Verified "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$env:CARGO_CYCLONEDX_VERSION/cargo-cyclonedx-x86_64-pc-windows-msvc.zip" $env:CARGO_CYCLONEDX_WINDOWS_SHA256 'cargo-cyclonedx.zip'
          Expand-Archive -LiteralPath $cyclonedx -DestinationPath (Join-Path $tools 'cyclonedx')
          Copy-Item (Join-Path $tools 'cyclonedx\cargo-cyclonedx.exe') $bin

          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, test and package with packaging/package.ps1
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/package.ps1
      - name: Run the packaged program from the extracted ZIP
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path dist -Filter 'ordinata-*.zip' -File)
          if ($zip.Count -ne 1) { throw "expected one package ZIP in dist, found $($zip.Count)" }
          $room = Join-Path $env:RUNNER_TEMP 'ordinata-check'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $room
          $exe = Join-Path (Join-Path $room $zip[0].BaseName) 'ordinata.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "the ZIP has no $exe" }
          # Only the system on PATH: libunwind.dll must come from the package itself.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          # Ordinata writes its messages to stderr; each step is judged by its exit code.
          $ErrorActionPreference = 'Continue'
          Set-Location $room
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          & $exe demo --out demo --observed-at 2026-01-01T00:00:00Z
          if ($LASTEXITCODE -ne 0) { throw "demo exited $LASTEXITCODE" }
          & $exe verify demo
          if ($LASTEXITCODE -ne 0) { throw "verify exited $LASTEXITCODE" }
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordinata-windows-x86_64
          path: dist/ordinata-*.zip
          if-no-files-found: error

  release:
    name: Checksums and draft release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Collect the packages and write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded \
            --name ordinata-linux-x86_64 --name ordinata-windows-x86_64
          mkdir release
          find downloaded -type f -exec mv -t release {} +
          (cd release && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS release/
          ls -l release
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: release/SHA256SUMS
          if-no-files-found: error
      - name: Create the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          linux="ordinata-$version-x86_64-unknown-linux-gnu.tar.gz"
          windows="ordinata-$version-x86_64-pc-windows-gnullvm.zip"
          # The tag must name the version that was packaged.
          test -f "release/$linux"
          test -f "release/$windows"
          cat > notes.md <<EOF
          Ordinata $version: a local linear inverse-problem and uncertainty workbench.

          - Windows x86_64: \`$windows\`. Extract it and run \`ordinata.exe\` from the extracted folder.
          - Linux x86_64: \`$linux\`. Extract it and run \`./ordinata\`.

          Check a download with \`sha256sum -c SHA256SUMS --ignore-missing\`. The README explains each command.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Ordinata $GITHUB_REF_NAME" --notes-file notes.md \
            "release/$linux" "release/$windows" release/SHA256SUMS
